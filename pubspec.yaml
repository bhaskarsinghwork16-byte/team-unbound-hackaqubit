name: healthscreen_ai
description: AI-Assisted Early Screening for Diabetic Retinopathy & Oral Cancer on Low-End Hardware
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera
  camera: ^0.10.5+9
  image_picker: ^1.0.7

  # AI / Inference
  tflite_flutter: ^0.10.4
  image: ^4.1.7

  # Database / Storage
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # UI / UX
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  percent_indicator: ^4.2.3
  intl: ^0.19.0

  # Image processing
  flutter_image_compress: ^2.2.0

  # Permissions
  permission_handler: ^11.3.1

  # Connectivity
  connectivity_plus: ^6.0.3

  # Icons
  flutter_svg: ^2.0.10+1
  cupertino_icons: ^1.0.6

  # File operations
  share_plus: ^9.0.0
  pdf: ^3.11.0
  printing: ^5.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/models/
    - assets/demo/
    - assets/icons/
    - assets/lottie/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
